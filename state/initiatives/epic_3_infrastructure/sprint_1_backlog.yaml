Epic: "Epic 3: Infrastructure Adapters & PNG Renderer"
Sprint: 1
TaskName: "Implement 250x250 PNG Image Rasterizer and Stream Encoder Adapter"
TargetFiles:
  - "workspace/avatar-service/internal/infrastructure/renderer/png_renderer.go"
  - "workspace/avatar-service/internal/infrastructure/renderer/png_renderer_test.go"
AcceptanceCriteria:
  - "Implement the `PNGRenderer` struct in `internal/infrastructure/renderer/png_renderer.go` that satisfies the `repository.AvatarRenderer` interface."
  - "Implement the provider constructor `NewPNGRenderer() repository.AvatarRenderer` returning the domain port interface."
  - "Implement the `Render(avatar *model.Avatar) ([]byte, error)` method that validates input and returns a descriptive error if `avatar` is nil or contains invalid grid dimensions."
  - "Initialize a 250x250 pixel RGBA canvas (`image.NewRGBA(image.Rect(0, 0, 250, 250))`) and pre-fill the entire background with default light gray `#F0F2F5` (`color.RGBA{R: 240, G: 242, B: 245, A: 255}`)."
  - "Iterate through the 5x5 boolean grid of the `model.Avatar` entity; for each cell evaluated as `true`, rasterize a 50x50 pixel block at coordinates `(col*50, row*50)` to `((col+1)*50, (row+1)*50)` using `image/draw` (`draw.Draw`) with `avatar.Color`."
  - "Encode the completed image into PNG binary format using Go standard library `image/png.Encode` into a `bytes.Buffer` and return the resulting byte slice (`[]byte`)."
  - "Maintain strict zero external dependencies, utilizing only standard Go library packages (`bytes`, `errors`, `fmt`, `image`, `image/color`, `image/draw`, `image/png`)."
DoD:
  - "Unit test suite in `png_renderer_test.go` achieves 100% statement and branch coverage of `PNGRenderer`."
  - "Test suite validates that the output starts with the standard PNG magic byte header (`\\x89PNG\\r\\n\\x1a\\n`)."
  - "Test suite decodes the rendered PNG binary via `png.Decode` and asserts that image bounds are exactly 250x250 pixels."
  - "Test suite samples pixel colors at block centers `(col*50 + 25, row*50 + 25)` to verify exact color matching against `avatar.Color` (for filled cells) and background `#F0F2F5` (for blank cells)."
  - "Test suite verifies that calling `Render(nil)` returns an explicit non-nil error without causing a panic."
  - "Code adheres to Go Clean Architecture standards with no cyclic imports or domain leakage."
  - "Source code passes standard static analysis (`go vet`, `golint` / `golangci-lint`) and formatting (`gofmt`)."

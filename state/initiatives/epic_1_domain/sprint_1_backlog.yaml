Epic: "Epic 1: Domain Core & Algorithmic Modeling"
Sprint: 1
TaskName: "Implement 5×5 Symmetric Grid Matrix Entity & Deterministic Parity Fill Algorithm"
TargetFiles:
  - "workspace/avatar-service/internal/domain/model/grid.go"
  - "workspace/avatar-service/internal/domain/model/grid_test.go"
AcceptanceCriteria:
  - "Define the `Grid` domain entity struct encapsulating a 5×5 boolean matrix (`Cells [5][5]bool`)."
  - "Implement the exported constructor `NewGrid(hash [16]byte) *Grid` within `internal/domain/model/grid.go`."
  - "Implement deterministic parity-based cell fill logic where `byte % 2 == 0` evaluates to `true` (filled) and `byte % 2 != 0` evaluates to `false` (blank)."
  - "Map the 16-byte MD5 hash array across the 5 rows for the first 3 columns: Row 0 -> [B3, B4, B5], Row 1 -> [B6, B7, B8], Row 2 -> [B9, B10, B11], Row 3 -> [B12, B13, B14], Row 4 -> [B15, B0, B1]."
  - "Enforce strict horizontal symmetry for columns 3 and 4 across all rows: `grid.Cells[row][3] = grid.Cells[row][1]` and `grid.Cells[row][4] = grid.Cells[row][0]` for `row` in 0..4."
  - "Ensure zero external dependencies and zero infrastructure/rendering imports in `internal/domain/model`."
  - "Implement comprehensive unit tests in `internal/domain/model/grid_test.go` validating parity calculation, symmetry invariance, and deterministic output across fixed hash vectors."
DoD:
  - "100% unit test statement and branch coverage achieved for `grid.go` via `go test -v -cover ./internal/domain/model/...`."
  - "Race condition detection passes cleanly with zero data races (`go test -race ./internal/domain/model/...`)."
  - "Code complies with standard Go formatting (`go fmt`), passes `go vet`, and produces zero linter warnings."
  - "Exported symbols and constructor signatures (`Grid`, `NewGrid`) strictly adhere to Clean Architecture specifications with no external third-party dependencies."
  - "Unit test suite includes explicit edge case test vectors (e.g., all even bytes, all odd bytes, alternating bytes, zero-filled hash) verifying symmetry across all 5 rows."
